<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tugas Kuliah Albert</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header Dashboard -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="font-weight: 800; color: #2c3e50; font-size: 24px;">Tugas Kuliah Albert 📚</h1>
            <button onclick="logout()" style="background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
        </div>

        <!-- Form Tambah Tugas -->
        <div class="card-form">
            <h3 style="margin-bottom: 15px; font-weight: 700; color: #333;">Tambah Tugas Baru</h3>
            <form id="taskForm">
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="taskTitle" placeholder="Nama tugas (Contoh: Makalah PBO)" required style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                    
                    <select id="taskCourse" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Kalkulus">Kalkulus</option>
                        <option value="Berpikir Komputasional & Pemecahan masalah">Berpikir Komputasional & Pemecahan masalah</option>
                        <option value="Logika Matematika">Logika Matematika</option>
                        <option value="Dasar Pemrograman">Dasar Pemrograman</option>
                        <option value="Statistika & Probabilitas">Statistika & Probabilitas</option>
                        <option value="Pengantar Teknologi & Desain">Pengantar Teknologi & Desain</option>
                    </select>

                    <!-- Input Tanggal & Jam Dropdown 24 Jam (00 - 23) -->
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="date" id="taskDate" required style="flex: 2; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                        
                        <!-- Dropdown Jam (00-23) -->
                        <select id="taskHour" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                            <option value="17">17</option>
                            <option value="18">18</option>
                            <option value="19">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                            <option value="22">22</option>
                            <option value="23">23</option>
                            <option value="00">00</option>
                        </select>
                        
                        <span style="font-weight: bold; color: #555;">:</span>

                        <!-- Dropdown Menit -->
                       <!-- Dropdown Menit Lengkap (00 - 59) -->
                        <select id="taskMinute" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                            <option value="00">00</option>
                            <option value="01">01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>
                            <option value="06">06</option>
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                            <option value="17">17</option>
                            <option value="18">18</option>
                            <option value="19">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                            <option value="22">22</option>
                            <option value="23">23</option>
                            <option value="24">24</option>
                            <option value="25">25</option>
                            <option value="26">26</option>
                            <option value="27">27</option>
                            <option value="28">28</option>
                            <option value="29">29</option>
                            <option value="30">30</option>
                            <option value="31">31</option>
                            <option value="32">32</option>
                            <option value="33">33</option>
                            <option value="34">34</option>
                            <option value="35">35</option>
                            <option value="36">36</option>
                            <option value="37">37</option>
                            <option value="38">38</option>
                            <option value="39">39</option>
                            <option value="40">40</option>
                            <option value="41">41</option>
                            <option value="42">42</option>
                            <option value="43">43</option>
                            <option value="44">44</option>
                            <option value="45">45</option>
                            <option value="46">46</option>
                            <option value="47">47</option>
                            <option value="48">48</option>
                            <option value="49">49</option>
                            <option value="50">50</option>
                            <option value="51">51</option>
                            <option value="52">52</option>
                            <option value="53">53</option>
                            <option value="54">54</option>
                            <option value="55">55</option>
                            <option value="56">56</option>
                            <option value="57">57</option>
                            <option value="58">58</option>
                            <option value="59">59</option>
                        </select>
                    </div>

                    <select id="taskSource" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                        <option value="Google Classroom">Google Classroom</option>
                        <option value="E-Learning Kampus">E-Learning Kampus</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>

                   <button type="submit" style="padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Tambah Tugas</button>
    </div>
</form>
        </div>

        <!-- Daftar Tugas -->
        <div class="card-list">
            <h3 style="margin-bottom: 15px; font-weight: 700; color: #333;">Daftar Tugas</h3>
            <ul id="taskList" style="list-style: none; padding: 0;">
                <!-- Tugas akan muncul di sini secara otomatis -->
            </ul>
        </div>
    </div>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }
    </script>
  <script src="script.js"></script>
</body>
</html>
